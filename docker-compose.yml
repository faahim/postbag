services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postbag
      POSTGRES_USER: postbag
      POSTGRES_PASSWORD: postbag
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postbag -d postbag"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postbag-postgres:/var/lib/postgresql/data

  # Optional: the full server image against the compose db, for self-host smoke tests
  # (`docker compose --profile server up --build`). Not started by plain `docker compose up`.
  server:
    build: .
    profiles: ["server"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postbag:postbag@db:5432/postbag
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: devsecretdevsecretdevsecretdevsecret
      POSTBAG_ROLE: all
      TZ: UTC
      MIGRATE_ON_BOOT: "true"
      MAIL_FROM: "Postbag <postbag@updates.withfaahim.com>"
      # To enable attachments, add STORAGE_ENDPOINT, STORAGE_REGION, STORAGE_BUCKET,
      # STORAGE_ACCESS_KEY_ID and STORAGE_SECRET_ACCESS_KEY for a private
      # S3-compatible bucket. MinIO users usually also set STORAGE_FORCE_PATH_STYLE=true.
    ports:
      - "3000:3000"

volumes:
  postbag-postgres:
