name: Release

# Publishes the public packages (@postbag/sdk, postbag, @postbag/mcp) to npm with
# **trusted publishing (OIDC)** — no long-lived npm token in this repo.
#
# One-time setup (npm's rule: a package must exist before it can trust a workflow, so
# the very first version of each package is published by a human with 2FA):
#   1. pnpm -r publish --access public --no-git-checks        # once, locally, with OTP
#   2. for p in postbag @postbag/sdk @postbag/mcp; do
#        npm trust github "$p" --repo faahim/postbag --workflow release.yml --allow-publish
#      done                                                   # npm >= 11.15, prompts 2FA
# After that: bump with `pnpm release:version <v>`, commit, push tag `v<v>` → this runs.
# pnpm exchanges the GitHub OIDC token for a short-lived npm token by itself
# (it logs "Skipped OIDC" when no trusted publisher is configured yet).
#
# --provenance is added automatically by npm for OIDC publishes from *public* repos;
# the repo is private today, so provenance starts working the day it goes public.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pnpm publish with --dry-run"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional hardening: create a GitHub environment named `npm` with required reviewers
    # and set the same environment name in each package's trusted-publisher config.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @postbag/sdk --filter postbag --filter @postbag/mcp build
      - run: pnpm --filter @postbag/sdk --filter postbag --filter @postbag/mcp test
      - name: Publish (trusted publishing)
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: pnpm -r publish --access public --no-git-checks $DRY
