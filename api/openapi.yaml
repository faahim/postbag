                  next_cursor:
                    type:
                      - string
                      - "null"
                required:
                  - data
                  - next_cursor
    post:
      operationId: forms_create
      tags:
        - forms
      summary: Create a form
      description: 'Pass `from_template` (a stream id) to attach the new form to that
        stream with a schema copied 1:1 from it, so the mapping is trivially
        complete. Pass `if_exists: "return"` to make this call safe to re-run.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{1,62}$/u
                project:
                  type: string
                  default: default
                tags:
                  type: array
                  items:
                    type: string
                  default: []
                status:
                  type: string
                  enum:
                    - active
                    - paused
                  default: active
                schema_mode:
                  type: string
                  enum:
                    - observe
                    - enforce
                    - managed
                  default: observe
                settings:
                  type: object
                  properties:
                    allowed_origins:
                      type: array
                      items:
                        type: string
                        format: uri
                      default: []
                    redirect_url:
                      type:
                        - string
                        - "null"
                      format: uri
                    honeypot_field:
                      type: string
                      default: _gotcha
                    turnstile:
                      type: object
                      properties:
                        secret:
                          type: string
                        enabled:
                          type: boolean
                    rate_limit:
                      type: object
                      properties:
                        per_minute:
                          type: integer
                          exclusiveMinimum: 0
                          default: 10
                        burst:
                          type: integer
                          exclusiveMinimum: 0
                          default: 20
                    reply_to_field:
                      type:
                        - string
                        - "null"
                schema:
                  type: object
                  properties:
                    json_schema:
                      type: object
                      additionalProperties: {}
                      description: JSON Schema draft 2020-12 describing the submission data.
                        `required` drives drift detection and mapping
                        completeness.
                    ui:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties: {}
                      description: Per-field rendering hints keyed by field name (label, placeholder,
                        widget, options, order) — used to render embed snippets.
                    changelog:
                      type: string
                      description: A short human note on what changed in this version, shown in the
                        version history.
                  required:
                    - json_schema
                from_template:
                  type: string
                if_exists:
                  type: string
                  enum:
                    - error
                    - return
                  default: error
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormCreated"
        "400":
          description: Error
          content:
            application/json:
              schema:
