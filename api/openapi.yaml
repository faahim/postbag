  parameters: {}
paths:
  /v1/auth/providers:
    get:
      operationId: auth_providers
      tags:
        - discovery
      summary: Which sign-in methods this instance has configured
      description: "Public, unauthenticated. Email/password reports sign-in and
        sign-up separately because hosted Postbag keeps password sign-in for
        existing users while disabling new password registration. `social` lists
        only the OAuth providers this instance has both a client id and secret
        for (self-host parity: a self-hosted instance with neither configured
        returns an empty list). The dashboard calls this once, cached, to decide
        which social sign-in buttons to render."
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_password:
                    type: object
                    properties:
                      sign_in:
                        type: boolean
                      sign_up:
                        type: boolean
                    required:
                      - sign_in
                      - sign_up
                  email_code:
                    type: object
                    properties:
                      sign_in:
                        type: boolean
                      sign_up:
                        type: boolean
                    required:
                      - sign_in
                      - sign_up
                  social:
                    type: array
                    items:
                      type: string
                      enum:
                        - google
                        - github
                  sign_in_url:
                    type: string
                required:
                  - email_password
                  - email_code
                  - social
                  - sign_in_url
  /v1/billing/webhook:
    post:
      operationId: billing_webhook
      tags:
        - billing
      summary: Receive a signed Polar webhook
      security: []
      parameters:
        - schema:
            type: string
          required: true
          name: webhook-id
          in: header
        - schema:
            type: string
          required: true
          name: webhook-timestamp
          in: header
        - schema:
            type: string
          required: true
          name: webhook-signature
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "202":
          description: accepted
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/auth/request-code:
    post:
      operationId: auth_request_code
      tags:
        - discovery
      summary: Email a 6-digit sign-in code (step 1 of agent onboarding without a
        browser)
      description: Public, unauthenticated. Sends a 6-digit code good for 10 minutes
        to the given address. Always 200 for a well-formed email, whether or not
        an account exists — this endpoint never confirms or denies an account's
        existence. Rate limited per email and per client IP. The human reads the
        code out of their inbox and gives it to the agent, which calls POST
        /v1/auth/verify-code next.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Lowercased and trimmed before use. Always 200s for a well-formed
                    address.
              required:
                - email
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  expires_in:
                    type: integer
                  next:
                    type: string
                required:
                  - ok
                  - expires_in
                  - next
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          description: Email sending is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The code email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/auth/verify-code:
    post:
      operationId: auth_verify_code
      tags:
        - discovery
      summary: Verify a code and mint an API key (step 2 of agent onboarding without a
        browser)
      description: Public, unauthenticated. Verifies the code sent by POST
        /v1/auth/request-code and, on success, mints an API key through the same
        path POST /v1/api-keys uses — default scope manage. A new email
        provisions a personal organization first, exactly like every other
        sign-up path. An existing user's key is minted against their personal
        organization (the one they own, oldest first, if they belong to
        several). This does not set a session cookie — it mints a key, it does
        not log a browser in.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: The 6-digit code from the email.
                key_name:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Defaults to "agent · <YYYY-MM-DD>".
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - manage
                      - read
                      - submit
                  minItems: 1
                  default:
                    - manage
              required:
                - email
                - code
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: Shown once — store it immediately.
                  key_id:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                      enum:
                        - manage
                        - read
                        - submit
                  organization:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                    required:
                      - id
                      - slug
                      - name
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                      created:
                        type: boolean
                    required:
                      - email
                      - created
                  next:
                    type: array
                    items:
                      type: string
                required:
                  - api_key
                  - key_id
                  - scopes
                  - organization
                  - user
                  - next
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/public/sandboxes:
    post:
      operationId: public_sandboxes_create
      tags:
        - discovery
      summary: Create a bounded 24-hour sandbox Form without an account
      description: Requires a canonical UUIDv4 Idempotency-Key. Creates an inert
        sandbox Form that can accept at most five test Submissions and cannot
        create Destinations, Routes, Deliveries, Events or outbound traffic.
      security: []
      parameters:
        - schema:
            type: string
            description: Canonical lowercase UUIDv4 generated with a CSPRNG.
          required: true
          description: Canonical lowercase UUIDv4 generated with a CSPRNG.
          name: idempotency-key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                origin:
                  type: string
                  format: uri
                  description: The site origin allowed to submit, canonicalized before storage.
                claim_email:
                  type: string
                  format: email
                  description: Optional verified-email binding. Include only when the user
                    explicitly supplied it.
              required:
                - name
              additionalProperties: false
      responses:
        "201":
          description: created or idempotently replayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandbox:
                    type: object
                    properties:
                      id:
                        type: string
                        example: fm_8f3kq2
                      name:
                        type: string
                      status:
                        type: string
                        enum:
                          - active
                          - claimed
                          - expired
                          - blocked
                      submit_url:
                        type: string
                      expires_at:
                        type: string
                        example: 2026-08-21T09:00:00.000Z
                      accepted_count:
                        type: integer
                      remaining:
                        type: integer
                    required:
                      - id
                      - name
                      - status
                      - submit_url
                      - expires_at
                      - accepted_count
                      - remaining
                  sandbox_token:
                    type: string
                    description: Shown only in this response. Treat it as a secret.
                  authorization:
                    type: object
                    properties:
                      scheme:
                        type: string
                        enum:
                          - Sandbox
                      example:
                        type: string
                    required:
                      - scheme
                      - example
                  embed:
                    type: object
                    properties:
                      html:
                        type: string
                      fetch:
                        type: string
                      react:
                        type: string
                      astro:
                        type: string
                      nextjs_action:
                        type: string
                    required:
                      - html
                      - fetch
                      - react
                      - astro
                      - nextjs_action
                  verify:
                    type: object
                    properties:
                      curl:
                        type: string
                      then:
                        type: string
                    required:
                      - curl
                      - then
                  claim_url:
                    type: string
                  next:
                    type: array
                    items:
                      type: object
                      properties:
                        why:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        headers:
                          type: object
                          additionalProperties:
                            type: string
                        body:
                          type: object
                          additionalProperties: {}
                      required:
                        - why
                        - method
                        - path
                required:
                  - sandbox
                  - sandbox_token
                  - authorization
                  - embed
                  - verify
                  - claim_url
                  - next
        "409":
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Source allowance exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Disabled or globally full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
