                  - data
                  - next_cursor
    post:
      operationId: streams_create
      tags:
        - streams
      summary: Create a stream (optionally with its first schema version and sources)
      description: "A Stream collects Submissions from many Forms into one shared
        shape. Pass `schema` to define that shape up front, or omit it and pass
        `sources` — the first source's form then provides version 1 (copied from
        its published schema, its inferred draft, or the fields seen in recent
        submissions) with an identity mapping, so `{ name, sources: [{ form_id
        }] }` is a complete request."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{1,62}$/u
                schema:
                  type: object
                  properties:
                    json_schema:
                      type: object
                      additionalProperties: {}
                      description: JSON Schema draft 2020-12 describing the submission data.
                        `required` drives drift detection and mapping
                        completeness.
                    ui:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties: {}
                      description: Per-field rendering hints keyed by field name (label, placeholder,
                        widget, options, order) — used to render embed snippets.
                    changelog:
                      type: string
                      description: A short human note on what changed in this version, shown in the
                        version history.
                  required:
                    - json_schema
                sources:
                  type: array
                  items:
                    type: object
                    properties:
                      form_id:
                        type: string
                        description: One Form feeding this Stream. Mutually exclusive with `selector`.
                      selector:
                        type: string
                        pattern: ^(?:tag|project):\S(?:.*\S)?$
                        description: "A dynamic Form source: non-empty `tag:<tag>` or
                          `project:<project_id>` without leading or trailing
                          whitespace after `:`. Mutually exclusive with
                          `form_id`."
                      mapping:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            from:
                              type: string
                              description: Copy this field's value from the source form's submitted data.
                            const:
                              description: Use this fixed value instead of anything from the source.
                            expr:
                              type: string
                              description: A JSONata expression evaluated against the source's data.
                            default:
                              description: Fallback value when the resolved value is missing.
                        description: Keyed by the stream schema's field names. Each entry is exactly one
                          of `from` (copy a field from the form's data), `const`
                          (a fixed value) or `expr` (a JSONata expression), plus
                          an optional `default`. Every required field in the
                          stream's schema must be covered or this call fails 422
                          mapping_incomplete.
                  default: []
                if_exists:
                  type: string
                  enum:
                    - error
