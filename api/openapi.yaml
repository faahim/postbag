  /v1/quickstart:
    post:
      operationId: quickstart
      tags:
        - discovery
      summary: One call to a working, routed form
      description: Creates (idempotently, by name within project) the project if
        missing, the form, a destination for whichever of
        notify_email/telegram/webhook was given, and a direct route, then
        returns the form, an embeddable snippet, a browser-equivalent curl
        command to verify delivery, and next steps. Allowed origins are compared
        canonically, so paths, trailing slashes, host casing, and default ports
        do not cause mismatches. Everything it does is also available as
        individual calls (POST /v1/forms, /v1/destinations, /v1/routes); this is
        a convenience, not a special path.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                project:
                  type: string
                  default: default
                origin:
                  type: string
                  format: uri
                notify_email:
                  type: string
                  format: email
                telegram:
                  type: object
                  properties:
                    bot_token:
                      type: string
                    chat_id:
                      type: string
                  required:
                    - bot_token
                    - chat_id
                webhook:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                    secret:
                      type: string
                  required:
                    - url
                tags:
                  type: array
                  items:
                    type: string
                  default: []
                redirect_url:
                  type: string
                  format: uri
              required:
                - name
      responses:
        "201":
          description: created (or returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  form:
                    $ref: "#/components/schemas/Form"
                  destinations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Destination"
                  routes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Route"
                  embed:
                    $ref: "#/components/schemas/Embed"
                  verify:
                    $ref: "#/components/schemas/Verify"
                  next:
                    type: array
                    items:
                      type: object
                      properties:
                        why:
                          type: string
                        method:
                          type: string
                        path:
                          type: string
                        body:
                          type: object
                          additionalProperties: {}
                required:
                  - form
                  - destinations
                  - routes
                  - embed
                  - verify
                  - next
