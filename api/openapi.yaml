  /health:
    get:
      operationId: health_get
      tags:
        - discovery
      summary: Liveness and readiness
      description: Public, unauthenticated. Reports database connectivity, worker
        heartbeat and the oldest pending delivery age.
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: string
                    enum:
                      - up
                      - down
                  worker:
                    type: object
                    properties:
                      heartbeat_at:
                        type:
                          - string
                          - "null"
                      alive:
                        type: boolean
                    required:
                      - heartbeat_at
                      - alive
                  oldest_pending_delivery_s:
                    type:
                      - number
                      - "null"
                  version:
                    type: string
                required:
                  - ok
                  - db
                  - worker
                  - oldest_pending_delivery_s
                  - version
        "503":
          description: db down
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: string
                    enum:
                      - up
                      - down
                  worker:
                    type: object
                    properties:
                      heartbeat_at:
                        type:
                          - string
                          - "null"
                      alive:
                        type: boolean
                    required:
                      - heartbeat_at
                      - alive
                  oldest_pending_delivery_s:
                    type:
                      - number
                      - "null"
                  version:
                    type: string
                required:
                  - ok
                  - db
                  - worker
                  - oldest_pending_delivery_s
                  - version
