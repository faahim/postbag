  /v1/admin/plan-grants:
    post:
      operationId: admin_plan_grants_create
      tags:
        - admin
      summary: Mint a complimentary-access grant code (platform admin only)
      description: "Platform-admin only: allowed when the caller's email (the session
        user's email, or — for an API key — the owner member's email of the
        key's organization) is in the server's PLATFORM_ADMIN_EMAILS env var
        (comma-separated, empty by default). Any other caller gets 404
        not_found, not 403, so a self-hosted operator who never sets
        PLATFORM_ADMIN_EMAILS never sees this endpoint exist. Touches no tenant
        — the code is redeemed by an org's own owner with POST /v1/plan/redeem,
        which is where plan_source actually changes."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  enum:
                    - free
                    - pro
                    - team
                    - selfhost
                  description: The tier this code grants on redemption.
                note:
                  type: string
                  maxLength: 280
                  description: Shown to the redeeming org, e.g. "Courtesy of Postbag".
                expires_at:
                  type: string
                  format: date-time
                  description: When the code itself stops being redeemable. Omit for a code that
                    never expires on its own.
                max_redemptions:
                  type: integer
                  minimum: 1
                  default: 1
                  description: How many different organizations may redeem this code.
                plan_duration_days:
                  type: integer
                  minimum: 1
                  description: How many days after redemption the granted plan lasts. Omit for a
                    grant with no automatic expiry.
              required:
                - plan
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanGrantCreated"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Error
          content:
            application/json:
