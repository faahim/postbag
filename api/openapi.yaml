      description: System webhooks notify an external system when org events happen
        (not to be confused with a webhook destination, which delivers
        submissions).
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemWebhook"
    post:
      operationId: webhooks_create
      tags:
        - events
      summary: Subscribe a URL to event types
      description: Every delivery is signed with the returned (or supplied) secret so
        the receiver can verify authenticity.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - submission.received
                      - submission.quarantined
                      - submission.spam
                      - delivery.sent
                      - delivery.failed
                      - delivery.dead
                      - digest.ready
                      - form.created
                      - form.schema.changed
                      - stream.schema.changed
                      - drift.detected
                      - drift.resolved
                      - destination.failing
                      - destination.recovered
                  minItems: 1
                secret:
                  type: string
                enabled:
                  type: boolean
                  default: true
              required:
                - url
                - events
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemWebhook"
        "400":
          description: Error
          content:
            application/json:
